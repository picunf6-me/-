<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тест: биография А. И. Куприна</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        background: linear-gradient(135deg, #0d1b2a 0%, #12263a 50%, #1b3650 100%);
        color: #f3ede0;
        font-family: 'Segoe UI', Arial, sans-serif;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 24px 16px;
    }

    .container {
        width: 100%;
        max-width: 640px;
        background: rgba(27, 54, 80, 0.6);
        border: 1px solid rgba(224, 176, 74, 0.2);
        border-radius: 20px;
        padding: 28px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(10px);
        animation: fadeIn 0.5s ease-out;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to   { opacity: 1; transform: translateY(0); }
    }

    .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
        font-size: 13px;
        letter-spacing: 1px;
        text-transform: uppercase;
        color: #e0b04a;
    }

    .progress-track {
        width: 100%;
        height: 6px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 3px;
        overflow: hidden;
        margin-bottom: 24px;
    }

    .progress-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #e0b04a, #f0c060);
        border-radius: 3px;
        transition: width 0.4s ease;
        box-shadow: 0 0 10px rgba(224, 176, 74, 0.6);
    }

    #question {
        font-size: 22px;
        font-weight: 700;
        line-height: 1.35;
        margin-bottom: 24px;
        color: #f3ede0;
        animation: slideIn 0.35s ease-out;
    }

    @keyframes slideIn {
        from { opacity: 0; transform: translateX(-15px); }
        to   { opacity: 1; transform: translateX(0); }
    }

    .option {
        display: flex;
        align-items: center;
        gap: 14px;
        width: 100%;
        text-align: left;
        background: rgba(18, 38, 58, 0.9);
        color: #f3ede0;
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 12px;
        padding: 14px 18px;
        margin-bottom: 10px;
        font-size: 16px;
        cursor: pointer;
        transition: all 0.2s ease;
        animation: optionIn 0.3s ease-out backwards;
    }

    .option:nth-child(1) { animation-delay: 0.05s; }
    .option:nth-child(2) { animation-delay: 0.10s; }
    .option:nth-child(3) { animation-delay: 0.15s; }
    .option:nth-child(4) { animation-delay: 0.20s; }

    @keyframes optionIn {
        from { opacity: 0; transform: translateY(10px); }
        to   { opacity: 1; transform: translateY(0); }
    }

    .option:not(:disabled):hover {
        background: rgba(35, 74, 107, 1);
        border-color: rgba(224, 176, 74, 0.4);
        transform: translateX(4px);
    }

    .option:disabled { cursor: default; }

    .option.correct {
        background: linear-gradient(135deg, #1d5a3a, #2a7a4f);
        border-color: #5fcf8b;
        box-shadow: 0 0 20px rgba(95, 207, 139, 0.3);
    }

    .option.wrong {
        background: linear-gradient(135deg, #6a2a26, #8a3833);
        border-color: #ff8a80;
    }

    .badge {
        flex-shrink: 0;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: rgba(224, 176, 74, 0.15);
        color: #e0b04a;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 14px;
        transition: all 0.2s ease;
    }

    .option.correct .badge {
        background: rgba(95, 207, 139, 0.25);
        color: #5fcf8b;
    }

    .option.wrong .badge {
        background: rgba(255, 138, 128, 0.25);
        color: #ff8a80;
    }

    .option-text { flex: 1; }

    #feedback {
        font-weight: 600;
        font-size: 15px;
        margin: 18px 0;
        min-height: 22px;
        text-align: center;
        animation: fadeIn 0.3s ease-out;
    }

    .actions {
        display: flex;
        justify-content: center;
        margin-top: 8px;
    }

    #nextBtn {
        display: none;
        background: linear-gradient(135deg, #e0b04a, #f0c060);
        color: #12263a;
        border: none;
        border-radius: 12px;
        padding: 14px 36px;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.2s ease;
        box-shadow: 0 8px 24px rgba(224, 176, 74, 0.35);
        letter-spacing: 0.5px;
    }

    #nextBtn:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 32px rgba(224, 176, 74, 0.5);
    }

    #nextBtn:active { transform: translateY(0); }

    .result {
        text-align: center;
        padding: 20px 0;
        animation: fadeIn 0.5s ease-out;
    }

    .result-score {
        font-size: 72px;
        font-weight: 800;
        background: linear-gradient(135deg, #e0b04a, #f0c060);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1;
        margin: 16px 0;
    }

    .result-total { font-size: 24px; color: rgba(243, 237, 224, 0.5); }

    .result-msg {
        font-size: 17px;
        margin: 20px 0;
        color: #f3ede0;
        line-height: 1.5;
    }
</style>
</head>
<body>
<div class="container">
    <div class="header">
        <span id="counter">Вопрос 1 из 10</span>
        <span id="percent">0%</span>
    </div>
    <div class="progress-track">
        <div class="progress-fill" id="progress"></div>
    </div>

    <div id="question"></div>
    <div id="options"></div>
    <div id="feedback"></div>
    <div class="actions">
        <button id="nextBtn">Дальше</button>
    </div>
</div>

<script>
    const QUESTIONS = [
        ["В каком году родился Куприн?", ["1865", "1870", "1875", "1880"], 1],
        ["В каком городе он родился?", ["Наровчат", "Киев", "Пенза", "Москва"], 0],
        ["От чего умер его отец?", ["От холеры", "От тифа", "От ранения", "От чахотки"], 0],
        ["Какое училище Куприн окончил в 1890 году?",
            ["Морской корпус", "Юнкерское артиллерийское", "Александровское военное", "Пажеский корпус"], 2],
        ["Какое произведение 1905 года принесло ему всероссийскую славу?",
            ["«Олеся»", "«Поединок»", "«Молох»", "«Яма»"], 1],
        ["Какая повесть Куприна рассказывает о самоотверженной любви?",
            ["«Гранатовый браслет»", "«Молох»", "«Яма»", "«Гамбринус»"], 0],
        ["С кем из писателей дружил Куприн?",
            ["Ф. М. Достоевский", "Н. В. Гоголь", "М. Ю. Лермонтов", "И. А. Бунин"], 3],
        ["Какое из этих произведений Куприн написал о животных?",
            ["«Муму»", "«Белый пудель»", "«Каштанка»", "«Белый Бим Чёрное ухо»"], 1],
        ["В каком городе Куприн жил в эмиграции?", ["Берлин", "Прага", "Париж", "Белград"], 2],
        ["В каком году он вернулся в СССР?", ["1934", "1935", "1936", "1937"], 3],
    ];

    const LETTERS = ["A", "B", "C", "D"];
    const TOTAL = QUESTIONS.length;

    let i = 0;
    let score = 0;

    const counterEl = document.getElementById("counter");
    const percentEl = document.getElementById("percent");
    const progressEl = document.getElementById("progress");
    const questionEl = document.getElementById("question");
    const optionsEl = document.getElementById("options");
    const feedbackEl = document.getElementById("feedback");
    const nextBtn = document.getElementById("nextBtn");

    function showQuestion() {
        const [q, options] = QUESTIONS[i];
        counterEl.textContent = `Вопрос ${i + 1} из ${TOTAL}`;
        const pct = Math.round((i / TOTAL) * 100);
        percentEl.textContent = pct + "%";
        progressEl.style.width = pct + "%";
        questionEl.textContent = q;
        feedbackEl.textContent = "";
        nextBtn.style.display = "none";
        optionsEl.innerHTML = "";

        options.forEach((text, k) => {
            const btn = document.createElement("button");
            btn.className = "option";
            btn.innerHTML = `<span class="badge">${LETTERS[k]}</span><span class="option-text">${text}</span>`;
            btn.onclick = () => pick(k);
            optionsEl.appendChild(btn);
        });
    }

    function pick(k) {
        const [_, options, right] = QUESTIONS[i];
        const buttons = optionsEl.querySelectorAll(".option");

        buttons.forEach((b, j) => {
            b.disabled = true;
            const badge = b.querySelector(".badge");
            if (j === right) {
                b.classList.add("correct");
                badge.textContent = "✓";
            } else if (j === k) {
                b.classList.add("wrong");
                badge.textContent = "✗";
            }
        });

        if (k === right) {
            score++;
            feedbackEl.textContent = "Верно! ✓";
            feedbackEl.style.color = "#5fcf8b";
        } else {
            feedbackEl.textContent = "Неверно. Правильный ответ: " + options[right];
            feedbackEl.style.color = "#ff8a80";
        }

        const last = i === TOTAL - 1;
        nextBtn.textContent = last ? "Узнать результат" : "Дальше →";
        nextBtn.style.display = "inline-block";
    }

    nextBtn.onclick = () => {
        i++;
        if (i < TOTAL) showQuestion();
        else finish();
    };

    function finish() {
        percentEl.textContent = "100%";
        progressEl.style.width = "100%";
        counterEl.textContent = "Результат";

        let msg, emoji;
        if (score >= 9) { msg = "Отлично, ты хорошо знаешь биографию Куприна."; emoji = "🏆"; }
        else if (score >= 6) { msg = "Хороший результат. Ещё немного, и будет идеально."; emoji = "👍"; }
        else { msg = "Стоит перечитать биографию и попробовать снова."; emoji = "📖"; }

        questionEl.style.display = "none";
        optionsEl.innerHTML = "";
        feedbackEl.innerHTML = `
            <div class="result">
                <div style="font-size: 48px">${emoji}</div>
                <div class="result-score">${score}<span class="result-total"> / ${TOTAL}</span></div>
                <div class="result-msg">${msg}</div>
            </div>
        `;

        nextBtn.textContent = "Пройти ещё раз";
        nextBtn.style.display = "inline-block";
        nextBtn.onclick = restart;
    }

    function restart() {
        i = 0;
        score = 0;
        questionEl.style.display = "block";
        nextBtn.onclick = () => {
            i++;
            if (i < TOTAL) showQuestion();
            else finish();
        };
        showQuestion();
    }

    showQuestion();
</script>
</body>
</html>
