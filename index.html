<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Тест: биография А. И. Куприна</title>
    <style>
        body {
            background: #12263a;
            color: #f3ede0;
            font-family: Arial, sans-serif;
            max-width: 640px;
            margin: 40px auto;
            padding: 20px;
        }
        #counter {
            color: #e0b04a;
            font-size: 14px;
            margin-bottom: 10px;
        }
        #question {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .option {
            display: block;
            width: 100%;
            text-align: left;
            background: #1b3650;
            color: #f3ede0;
            border: none;
            border-radius: 6px;
            padding: 12px 16px;
            margin-bottom: 8px;
            font-size: 16px;
            cursor: pointer;
        }
        .option:hover {
            background: #234a6b;
        }
        .option.correct {
            background: #1d5a3a;
        }
        .option.wrong {
            background: #6a2a26;
        }
        .option:disabled {
            cursor: default;
        }
        #feedback {
            font-weight: bold;
            margin: 16px 0;
            min-height: 24px;
        }
        #nextBtn {
            display: none;
            background: #e0b04a;
            color: #12263a;
            border: none;
            border-radius: 6px;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        #nextBtn:hover {
            background: #f0c060;
        }
    </style>
</head>
<body>
    <div id="counter"></div>
    <div id="question"></div>
    <div id="options"></div>
    <div id="feedback"></div>
    <button id="nextBtn">Дальше</button>

    <script>
        const QUESTIONS = [
            ["В каком году родился Куприн?", ["1865", "1870", "1875", "1880"], 1],
            ["В каком городе он родился?", ["Наровчат", "Киев", "Пенза", "Москва"], 0],
            ["От чего умер его отец?", ["От холеры", "От тифа", "От ранения", "От чахотки"], 0],
            ["Какое училище Куприн окончил в 1890 году?",
                ["Морской корпус", "Юнкерское артиллерийское", "Александровское военное", "Пажеский корпус"], 2],
            ["Какое произведение 1905 года принесло ему всероссийскую славу?",
                ["«Олеся»", "«Поединок»", "«Молох»", "«Яма»"], 1],
            ["Какая повесть Куприна рассказывает о самоотверженной любви?",
                ["«Гранатовый браслет»", "«Молох»", "«Яма»", "«Гамбринус»"], 0],
            ["С кем из писателей дружил Куприн?",
                ["Ф. М. Достоевский", "Н. В. Гоголь", "М. Ю. Лермонтов", "И. А. Бунин"], 3],
            ["Какое из этих произведений Куприн написал о животных?",
                ["«Муму»", "«Белый пудель»", "«Каштанка»", "«Белый Бим Чёрное ухо»"], 1],
            ["В каком городе Куприн жил в эмиграции?", ["Берлин", "Прага", "Париж", "Белград"], 2],
            ["В каком году он вернулся в СССР?", ["1934", "1935", "1936", "1937"], 3],
        ];

        let i = 0;
        let score = 0;

        const counterEl = document.getElementById("counter");
        const questionEl = document.getElementById("question");
        const optionsEl = document.getElementById("options");
        const feedbackEl = document.getElementById("feedback");
        const nextBtn = document.getElementById("nextBtn");

        function showQuestion() {
            const [q, options] = QUESTIONS[i];
            counterEl.textContent = `Вопрос ${i + 1} из ${QUESTIONS.length}`;
            questionEl.textContent = q;
            feedbackEl.textContent = "";
            nextBtn.style.display = "none";
            optionsEl.innerHTML = "";

            options.forEach((text, k) => {
                const btn = document.createElement("button");
                btn.className = "option";
                btn.textContent = text;
                btn.onclick = () => pick(k);
                optionsEl.appendChild(btn);
            });
        }

        function pick(k) {
            const [_, options, right] = QUESTIONS[i];
            const buttons = optionsEl.querySelectorAll(".option");

            buttons.forEach((b, j) => {
                b.disabled = true;
                if (j === right) b.classList.add("correct");
                else if (j === k) b.classList.add("wrong");
            });

            if (k === right) {
                score++;
                feedbackEl.textContent = "Верно!";
                feedbackEl.style.color = "#5fcf8b";
            } else {
                feedbackEl.textContent = "Неверно. Правильный ответ: " + options[right];
                feedbackEl.style.color = "#ff8a80";
            }

            const last = i === QUESTIONS.length - 1;
            nextBtn.textContent = last ? "Узнать результат" : "Дальше";
            nextBtn.style.display = "inline-block";
        }

        nextBtn.onclick = () => {
            i++;
            if (i < QUESTIONS.length) {
                showQuestion();
            } else {
                finish();
            }
        };

        function finish() {
            const n = QUESTIONS.length;
            let msg;
            if (score >= 9) msg = "Отлично, ты хорошо знаешь биографию Куприна.";
            else if (score >= 6) msg = "Хороший результат. Ещё немного, и будет идеально.";
            else msg = "Стоит перечитать биографию и попробовать снова.";

            counterEl.textContent = "Готово";
            questionEl.textContent = `Твой результат: ${score} из ${n}`;
            optionsEl.innerHTML = "";
            feedbackEl.textContent = msg;
            feedbackEl.style.color = "#f3ede0";
            nextBtn.textContent = "Пройти ещё раз";
            nextBtn.style.display = "inline-block";
            nextBtn.onclick = restart;
        }

        function restart() {
            i = 0;
            score = 0;
            nextBtn.onclick = () => {
                i++;
                if (i < QUESTIONS.length) showQuestion();
                else finish();
            };
            showQuestion();
        }

        showQuestion();
    </script>
</body>
</html>
